name: generate all (snake + 3d)

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # 1. 检出仓库
      - name: Checkout repo
        uses: actions/checkout@v6

      # 2. 生成 3D 贡献图（官方版本）
      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. 列出根目录下所有文件（调试用，帮你确定实际文件名）
      - name: List all files
        run: ls -la

      # 4. 生成贪吃蛇动画
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/profile-snake-contrib/github-contribution-grid-snake.svg
            dist/profile-snake-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. 移动所有 3D 相关文件到指定目录
      - name: Organize 3D files
        run: |
          mkdir -p dist/profile-3d-contrib
          # 移动所有可能是 3D 贡献图的文件（通常以 profile- 开头或以 -contrib 结尾）
          for file in *.svg; do
            if [ -f "$file" ]; then
              # 排除 snake 相关的文件
              if [[ "$file" != *"snake"* ]] && [[ "$file" != *"github-contribution-grid"* ]]; then
                echo "Moving $file to dist/profile-3d-contrib/"
                mv "$file" dist/profile-3d-contrib/
              fi
            fi
          done
          echo "=== Final dist structure ==="
          ls -la dist/

      # 6. 推送到 output 分支
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
