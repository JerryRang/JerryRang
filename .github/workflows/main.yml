name: generate all (snake + 3d)

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # 1. 检出仓库 (升级到 v6 以消除警告)
      - name: Checkout repo
        uses: actions/checkout@v6

      # 2. 生成 3D 贡献图 (移除 output_dir，改用环境变量)
      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        # 该 Action 默认将图片生成在仓库根目录，后续步骤会处理这些文件

      # 3. 生成贪吃蛇动画 (保持不变)
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/profile-snake-contrib/github-contribution-grid-snake.svg
            dist/profile-snake-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 整理并推送文件到 output 分支
      - name: Organize and push to output branch
        run: |
          # 创建目标目录
          mkdir -p dist/profile-3d-contrib

          # 移动 3D 图到指定目录 (根据实际文件名调整)
          # 常用的文件名是 profile-night-rainbow.svg 和 profile-gitblock.svg
          # 如果生成的文件名不同，请根据实际情况修改
          if [ -f "profile-night-rainbow.svg" ]; then
            mv profile-night-rainbow.svg dist/profile-3d-contrib/
          fi
          if [ -f "profile-gitblock.svg" ]; then
            mv profile-gitblock.svg dist/profile-3d-contrib/
          fi

          # 确保 dist 目录存在，以便后续推送
          ls -la dist/
      # 5. 推送到 output 分支 (使用 v4 版本，已兼容 Node.js 24)
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
