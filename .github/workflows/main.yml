name: generate all (snake + 3d)

on:
  schedule:
    - cron: "0 */24 * * *"        # 每24小时自动运行
  workflow_dispatch:              # 支持手动触发
  push:
    branches:
      - main                      # 如果你的默认分支是 master，请改为 master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write             # 必须有写权限才能推送

    steps:
      # 1. 检出仓库（确保推送时能正确操作）
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. 生成 3D 贡献图（两种主题）
      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        with:
          output_dir: dist/profile-3d-contrib   # 输出到子目录

      # 3. 生成贪吃蛇动画（两种主题）
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/profile-snake-contrib/github-contribution-grid-snake.svg
            dist/profile-snake-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 将整个 dist/ 目录推送到 output 分支
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
