name: generate all (snake + 3d)

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # 1. 检出仓库
      - name: Checkout repo
        uses: actions/checkout@v6

      # 2. 生成 3D 贡献图（使用更稳定的版本）
      - name: Generate 3D contributions
        uses: gumbobrot/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. 查看生成了哪些文件（调试用，可保留或删除）
      - name: List generated 3D files
        run: ls -la *.svg || echo "No SVG files found in root"

      # 4. 生成贪吃蛇动画
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/profile-snake-contrib/github-contribution-grid-snake.svg
            dist/profile-snake-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. 整理所有文件到 dist/ 目录
      - name: Organize all files
        run: |
          # 创建 3D 目录
          mkdir -p dist/profile-3d-contrib

          # 移动根目录下所有 3D 相关的 SVG 文件（包括各种主题）
          # 这一步会移动所有 .svg 文件到 3D 目录，但排除 snake 生成的
          for file in *.svg; do
            if [ -f "$file" ]; then
              # 排除 snake 相关的文件（它们应该在 dist/ 里）
              if [[ "$file" != *"snake"* ]] && [[ "$file" != *"github-contribution-grid"* ]]; then
                echo "Moving $file to dist/profile-3d-contrib/"
                mv "$file" dist/profile-3d-contrib/
              fi
            fi
          done

          # 列出 dist 目录结构，方便检查
          echo "=== dist/ contents ==="
          ls -la dist/
          echo "=== dist/profile-3d-contrib/ contents ==="
          ls -la dist/profile-3d-contrib/ || echo "No 3D files found"
          echo "=== dist/profile-snake-contrib/ contents ==="
          ls -la dist/profile-snake-contrib/ || echo "No snake files found"

      # 6. 推送到 output 分支
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
